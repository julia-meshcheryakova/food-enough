name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [deploy]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web assets (root base path for native)
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk food-enough.apk

      - uses: actions/upload-artifact@v4
        with:
          name: food-enough-apk
          path: food-enough.apk

      - name: Publish to fixed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-latest \
            --title "Food Enough — Android (latest)" \
            --notes "Latest debug APK, auto-built from the deploy branch." \
            food-enough.apk \
          || gh release upload android-latest food-enough.apk --clobber
